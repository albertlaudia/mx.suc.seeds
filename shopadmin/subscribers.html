<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribers · Sindo Wellness Shop Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#c4476a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23c4476a'/%3E%3Ctext x='50' y='68' font-family='system-ui' font-size='56' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3C/svg%3E">
<link rel="manifest" href="https://seeds.scaleupcrm.com/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://seeds.scaleupcrm.com/design-system.css?v=v2.4">
<link rel="stylesheet" href="https://seeds.scaleupcrm.com/admin.css?v=v2.4">
</head>
<body data-page-title="Newsletter subscribers" data-page-subtitle="People who signed up for the 10% welcome discount.">
<div id="admin-root"></div>

<script src="https://seeds.scaleupcrm.com/admin-shell.js?v=v2.4"></script>
<script>
function escape(s) {
  return (s ?? '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const STORAGE_KEY = 'sindo_subscribers_v1';
const SUBSCRIBERS = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

function render() {
  const rows = SUBSCRIBERS.map((s, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><span class="mono">${escape(s.email)}</span></td>
      <td>${new Date(s.at).toLocaleString('en-SG', { dateStyle: 'medium', timeStyle: 'short' })}</td>
      <td class="actions">
        <button class="btn btn-ghost btn-sm" onclick="removeSub('${escape(s.email)}')" style="color:var(--c-error);">Remove</button>
      </td>
    </tr>
  `).join('');

  document.getElementById('admin-content').innerHTML = `
    <div class="admin-grid-stats">
      <div class="admin-stat"><div class="label">Total subscribers</div><div class="num">${SUBSCRIBERS.length}</div></div>
      <div class="admin-stat"><div class="label">This week</div><div class="num">${SUBSCRIBERS.filter(s => Date.now() - new Date(s.at).getTime() < 7 * 86400000).length}</div></div>
    </div>

    <div class="admin-grid-2">
      <div class="adm-card">
        <div class="adm-card-head"><h3>Email list</h3><button class="btn btn-ghost btn-sm" onclick="exportCSV()">Export CSV</button></div>
        <div class="adm-card-body tight">
          ${SUBSCRIBERS.length === 0 ? '<div class="adm-empty"><div class="icon">✉️</div><h3>No subscribers yet</h3><p>Subscribers who signup via the homepage popup or footer form will appear here.</p></div>' :
            `<table class="adm-table">
              <thead><tr><th>#</th><th>Email</th><th>Subscribed</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>`
          }
        </div>
      </div>
      <div class="adm-card">
        <div class="adm-card-head"><h3>Welcome email</h3></div>
        <div class="adm-card-body">
          <p class="muted" style="font-size:13px;">Subscribers receive this email immediately:</p>
          <div style="background: var(--c-surface-2); padding:16px; border-radius: var(--r-md); margin-top:12px; font-size:13px;">
            <strong>Subject:</strong> Welcome to Sindo — your 10% code inside<br><br>
            <strong>Body:</strong><br>
            Hi {{name}},<br><br>
            Thanks for subscribing. Here's your code: <strong>WELCOME10</strong><br>
            Use it at checkout on your first order.<br><br>
            — The Sindo team
          </div>
          <button class="btn btn-secondary btn-sm mt-4">Edit email template</button>
        </div>
      </div>
    </div>
  `;
}

window.removeSub = function(email) {
  if (!confirm(`Remove ${email} from subscribers?`)) return;
  const next = SUBSCRIBERS.filter(s => s.email !== email);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
  sindoToast(`Removed ${email}`);
  setTimeout(() => location.reload(), 800);
};

window.exportCSV = function() {
  const csv = 'email,subscribed_at\n' + SUBSCRIBERS.map(s => `${s.email},${s.at}`).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `subscribers-${Date.now()}.csv`; a.click();
  URL.revokeObjectURL(url);
  sindoToast(`Exported ${SUBSCRIBERS.length} subscribers`);
};

render();
</script>
</body>
</html>
