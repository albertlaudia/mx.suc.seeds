<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Sindo Wellness Shop Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#c4476a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23c4476a'/%3E%3Ctext x='50' y='68' font-family='system-ui' font-size='56' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3C/svg%3E">
<link rel="manifest" href="https://seeds.scaleupcrm.com/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://seeds.scaleupcrm.com/design-system.css?v=v2.4">
<link rel="stylesheet" href="https://seeds.scaleupcrm.com/admin.css?v=v2.4">
</head>
<body data-page-title="Dashboard" data-page-subtitle="Real-time view of your shop performance, orders, and customers." data-page-actions='<button class="btn btn-primary" onclick="window.location=\'orders.html\'">View orders →</button>'>
<div id="admin-root"></div>

<script src="https://seeds.scaleupcrm.com/admin-shell.js?v=v2.4"></script>
<script src="https://seeds.scaleupcrm.com/data.js?v=v6.9.2"></script>
<script>
// ── Dashboard data aggregator ──
(function () {
  // Pull orders from localStorage (saved by checkout) + demo seed data
  const STORAGE_KEY = 'sindo_admin_orders_v1';
  const SEED_ORDERS = [
    { ref: 'SINDO-2H4K9X', tracking: 'SS-202609-LRX6N', customer: 'Aria Setiawan', email: 'aria@example.com', city: 'Singapore', country: 'SG', items: 2, totalSgd: 87.45, createdAt: '2026-09-22T08:15:00Z', status: 'shipped', stage: 'transit' },
    { ref: 'SINDO-9P3M2Z', tracking: 'SS-202609-MQ4WB', customer: 'Jason Lee', email: 'j.lee@example.com', city: 'Jakarta', country: 'ID', items: 1, totalSgd: 32.10, createdAt: '2026-09-23T11:42:00Z', status: 'paid', stage: 'manually_ordered' },
    { ref: 'SINDO-1Y7D6A', tracking: 'SS-202609-NCP7K', customer: 'Maya Wong', email: 'maya@example.com', city: 'Kuala Lumpur', country: 'MY', items: 3, totalSgd: 142.30, createdAt: '2026-09-23T16:20:00Z', status: 'delivered', stage: 'delivered' },
    { ref: 'SINDO-5T2Q8B', tracking: null, customer: 'Test Buyer', email: 'test@example.com', city: 'Singapore', country: 'SG', items: 1, totalSgd: 43.87, createdAt: '2026-09-24T03:42:00Z', status: 'paid', stage: 'sindo_sg_warehouse' }
  ];

  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const allOrders = [...saved, ...SEED_ORDERS];

  // Pull user activity
  const reviews = JSON.parse(localStorage.getItem('sindo_reviews_v1') || '[]');
  const subs = JSON.parse(localStorage.getItem('sindo_subs_v1') || '[]');
  const wishlist = JSON.parse(localStorage.getItem('sindo_wishlist_v1') || '[]');

  // ── Aggregate metrics ──
  const totalRev = allOrders.reduce((s, o) => s + o.totalSgd, 0);
  const pendingOrders = allOrders.filter(o => o.status === 'paid').length;
  const inTransitOrders = allOrders.filter(o => ['shipped', 'transit'].includes(o.status)).length);
  const uniqueCustomers = new Set(allOrders.map(o => o.email)).size;

  // Pull product catalog for sold-items
  const products = window.PRODUCTS || [];
  const productSales = {};
  allOrders.forEach(o => {
    o.items?.forEach(i => {
      productSales[i.id] = (productSales[i.id] || 0) + (i.qty || 1);
    });
  });
  const topProducts = Object.entries(productSales)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([id, qty]) => {
      const p = products.find(x => x.id === id);
      return p ? { id, title: p.title, brand: p.brand, image: p.image, sold: qty, revenue: p.priceSgd * qty } : null;
    })
    .filter(Boolean);

  // Mock recent orders if catalog sales empty
  let recentList = topProducts;
  if (!recentList.length) {
    recentList = [
      { id: 'now-mag-glyc-180', title: 'NOW Foods, Magnesium Glycinate, 180 Tablets', brand: 'NOW Foods', image: 'https://placehold.co/60x60/d23f3f/ffffff?text=NOW', sold: 8, revenue: 247.04 },
      { id: 'cgn-bone-boost', title: 'California Gold Nutrition, Bone Boost', brand: 'California Gold Nutrition', image: 'https://placehold.co/60x60/d23f3f/ffffff?text=CGN', sold: 6, revenue: 256.08 },
      { id: 'cgn-prenatal', title: 'California Gold Nutrition, Prenatal + Omega-3', brand: 'California Gold Nutrition', image: 'https://placehold.co/60x60/d23f3f/ffffff?text=CGN', sold: 4, revenue: 170.68 },
      { id: 'rest-zzz', title: 'LifeSeasons, Rest-ZZZ Oral Strips', brand: 'LifeSeasons', image: 'https://placehold.co/60x60/d23f3f/ffffff?text=LS', sold: 3, revenue: 69.30 },
      { id: 'nw-adrenergize', title: "Nature's Way, ADRENergize", brand: "Nature's Way", image: 'https://placehold.co/60x60/d23f3f/ffffff?text=NW', sold: 2, revenue: 56.98 }
    ];
  }

  // ── HTML render ──
  const recentOrdersHtml = allOrders.slice(-5).reverse().map(o => {
    const stageBadge = { pending: 'pending', paid: 'pending', shipped: 'shipped', delivered: 'delivered', cancelled: 'cancelled' }[o.status] || 'pending';
    return `
      <tr>
        <td><span class="mono">${o.ref}</span></td>
        <td>${escape(o.customer)}<br><span class="muted" style="font-size:11px;">${o.city}, ${o.country}</span></td>
        <td>${o.items} item${o.items !== 1 ? 's' : ''}</td>
        <td class="num">S$${o.totalSgd.toFixed(2)}</td>
        <td><span class="adm-status ${stageBadge}">${o.status}</span></td>
        <td>${new Date(o.createdAt).toLocaleDateString('en-SG', { month: 'short', day: 'numeric' })}</td>
        <td class="actions">
          <a href="orders.html#${o.ref}" class="btn btn-ghost btn-sm">View</a>
        </td>
      </tr>
    `;
  }).join('');

  const topProdsHtml = recentList.map(p => `
    <div style="display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--c-border);">
      <img src="${p.image}" alt="" style="width:48px;height:48px;border-radius:8px;object-fit:cover;" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23fce4ec%22/></svg>'">
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escape(p.title)}</div>
        <div style="font-size:11px;color:var(--c-text-muted);">${escape(p.brand)}</div>
      </div>
      <div style="text-align:right;">
        <div class="mono" style="font-weight:700;font-size:13px;">${p.sold} sold</div>
        <div style="font-size:11px;color:var(--c-text-muted);">S$${(p.revenue || 0).toFixed(0)}</div>
      </div>
    </div>
  `).join('');

  const html = `
    <!-- Stat tiles -->
    <div class="admin-grid-stats">
      <div class="admin-stat">
        <div class="label">Total Revenue</div>
        <div class="num">S$${totalRev.toFixed(2)}</div>
        <div class="delta up">↗ +12.4% vs last week</div>
      </div>
      <div class="admin-stat">
        <div class="label">Total Orders</div>
        <div class="num">${allOrders.length}</div>
        <div class="delta up">↗ +${Math.max(1, Math.round(allOrders.length / 3))} this week</div>
      </div>
      <div class="admin-stat">
        <div class="label">Pending Fulfillment</div>
        <div class="num">${pendingOrders}</div>
        <div class="delta">⚠ Awaiting ship</div>
      </div>
      <div class="admin-stat">
        <div class="label">In Transit</div>
        <div class="num">${inTransitOrders}</div>
        <div class="delta">📦 Sindo Shipping</div>
      </div>
      <div class="admin-stat">
        <div class="label">Unique Customers</div>
        <div class="num">${uniqueCustomers}</div>
        <div class="delta up">↗ +${uniqueCustomers} total</div>
      </div>
      <div class="admin-stat">
        <div class="label">Subscribers</div>
        <div class="num">${subs.length}</div>
        <div class="delta up">✉ Newsletter list</div>
      </div>
    </div>

    <div class="admin-grid-2 admin-mt-6">
      <!-- Recent orders -->
      <div class="adm-card">
        <div class="adm-card-head">
          <div>
            <h3>Recent orders</h3>
            <div class="sub">Last 5 orders across all statuses</div>
          </div>
          <a href="orders.html" class="btn btn-ghost btn-sm">View all →</a>
        </div>
        <div class="adm-card-body tight">
          <table class="adm-table">
            <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th></th></tr></thead>
            <tbody>${recentOrdersHtml || `<tr><td colspan="7" style="text-align:center;color:var(--c-text-muted);padding:32px;">No orders yet</td></tr>`}</tbody>
          </table>
        </div>
      </div>

      <!-- Top products -->
      <div class="adm-card">
        <div class="adm-card-head">
          <div>
            <h3>Top selling products</h3>
            <div class="sub">By units sold</div>
          </div>
          <a href="products.html" class="btn btn-ghost btn-sm">Manage →</a>
        </div>
        <div class="adm-card-body">
          ${topProdsHtml || '<p class="muted">No sales data yet.</p>'}
        </div>
      </div>
    </div>

    <!-- Live activity -->
    <div class="admin-grid-3 admin-mt-6">
      <div class="adm-card">
        <div class="adm-card-head"><h3>Recent reviews</h3><a href="reviews.html" class="muted" style="font-size:12px;">${reviews.length} total</a></div>
        <div class="adm-card-body">
          ${reviews.length === 0
            ? '<p class="muted" style="font-size:13px;">No reviews submitted yet. Reviews will appear here as customers submit them.</p>'
            : reviews.slice(0, 3).map(r => `
              <div style="padding:8px 0;border-bottom:1px solid var(--c-border);font-size:13px;">
                <div style="color:#f59e0b;letter-spacing:1px;">${'★'.repeat(r.rating || 5)}</div>
                <div style="font-weight:600;margin:2px 0;">${escape(r.title || 'Review')}</div>
                <div class="muted" style="font-size:11px;">${escape(r.author)} · ${new Date(r.createdAt).toLocaleDateString()}</div>
              </div>
            `).join('')
          }
        </div>
      </div>
      <div class="adm-card">
        <div class="adm-card-head"><h3>Pipeline stages</h3></div>
        <div class="adm-card-body">
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${SHIPPING?.stages?.slice(0, 5).map((s, i) => `
              <div style="display:flex;align-items:center;gap:10px;font-size:13px;padding:4px 0;">
                <div style="width:24px;height:24px;border-radius:50%;background:var(--c-brand);color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;">${i+1}</div>
                <div style="flex:1;">${escape(s.label)}</div>
                <div class="muted" style="font-size:11px;">${escape((s.label || '').slice(0,20))}</div>
              </div>
            `).join('') || '<p class="muted">Loading pipeline…</p>'}
          </div>
        </div>
      </div>
      <div class="adm-card">
        <div class="adm-card-head"><h3>Quick actions</h3></div>
        <div class="adm-card-body">
          <div style="display:flex;flex-direction:column;gap:8px;">
            <a href="orders.html" class="btn btn-secondary btn-sm" style="justify-content:flex-start;">📦 Process pending orders (${pendingOrders})</a>
            <a href="products.html" class="btn btn-secondary btn-sm" style="justify-content:flex-start;">🧴 Manage product catalog</a>
            <a href="reviews.html" class="btn btn-secondary btn-sm" style="justify-content:flex-start;">⭐ Moderate reviews</a>
            <a href="subscribers.html" class="btn btn-secondary btn-sm" style="justify-content:flex-start;">✉️ Email subscribers (${subs.length})</a>
            <a href="settings.html" class="btn btn-secondary btn-sm" style="justify-content:flex-start;">⚙️ Store settings</a>
          </div>
        </div>
      </div>
    </div>
  `;

  const target = document.getElementById('admin-content');
  if (target) target.innerHTML = html;
  // Sidebar badges
  const ordersBadge = document.querySelector('[data-orders-count]');
  if (ordersBadge) ordersBadge.textContent = pendingOrders;
  const custBadge = document.querySelector('[data-customers-count]');
  if (custBadge) custBadge.textContent = uniqueCustomers;
  const reviewsBadge = document.querySelector('[data-reviews-count]');
  if (reviewsBadge) reviewsBadge.textContent = reviews.length;
})();

function escapeHtml(s) {
  return (s ?? '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escape(s) { return escapeHtml(s); }
</script>


</body>
</html>
