<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · Sindo Wellness Shop Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#c4476a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23c4476a'/%3E%3Ctext x='50' y='68' font-family='system-ui' font-size='56' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3C/svg%3E">
<link rel="manifest" href="https://seeds.scaleupcrm.com/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://seeds.scaleupcrm.com/design-system.css?v=v2.6">
<link rel="stylesheet" href="https://seeds.scaleupcrm.com/admin.css?v=v2.6">
</head>
<body data-page-title="Shop settings" data-page-subtitle="Configure your shop name, contact info, and platform integrations.">
<div id="admin-root"></div>

<script src="https://seeds.scaleupcrm.com/admin-shell.js?v=v2.6"></script>
<script>
function escape(s) {
  return (s ?? '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const STORAGE_KEY = 'sindo_settings_v1';
const SEED = {
  shopName: 'Sindo Wellness',
  shopDomain: 'seeds.scaleupcrm.com',
  contactEmail: 'hello@seeds.scaleupcrm.com',
  whatsapp: '+6580000000',
  currency: 'SGD',
  tagline: 'Authentic · Shipped from Singapore',
  brandColor: '#c4476a',
  webhookUrl: 'https://api.sindo.id/v1/webhooks/orders',
  papermergeIntegration: { apiKey: '', folderId: '' }
};

function load() {
  let s = SEED;
  try { s = { ...SEED, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') }; } catch {}
  return s;
}

function save(s) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}

function render() {
  const s = load();
  document.getElementById('admin-content').innerHTML = `
    <form id="settings-form" class="adm-form">
      <div class="adm-card">
        <div class="adm-card-head"><h3>Shop identity</h3></div>
        <div class="adm-card-body">
          <div class="adm-form-row">
            <div class="adm-field">
              <label>Shop name</label>
              <input class="input" name="shopName" value="${escape(s.shopName)}">
            </div>
            <div class="adm-field">
              <label>Shop domain</label>
              <input class="input" name="shopDomain" value="${escape(s.shopDomain)}" readonly>
              <div class="hint">To change the domain, contact platform support.</div>
            </div>
          </div>
          <div class="adm-form-row">
            <div class="adm-field">
              <label>Contact email</label>
              <input type="email" class="input" name="contactEmail" value="${escape(s.contactEmail)}">
            </div>
            <div class="adm-field">
              <label>WhatsApp number</label>
              <input class="input" name="whatsapp" value="${escape(s.whatsapp)}">
            </div>
          </div>
          <div class="adm-form-row">
            <div class="adm-field">
              <label>Currency</label>
              <select class="input" name="currency">
                <option ${s.currency === 'SGD' ? 'selected' : ''}>SGD</option>
                <option ${s.currency === 'USD' ? 'selected' : ''}>USD</option>
                <option ${s.currency === 'IDR' ? 'selected' : ''}>IDR</option>
                <option ${s.currency === 'MYR' ? 'selected' : ''}>MYR</option>
              </select>
            </div>
            <div class="adm-field">
              <label>Brand color</label>
              <input type="color" class="input" name="brandColor" value="${escape(s.brandColor)}" style="height:40px;">
            </div>
          </div>
          <div class="adm-field">
            <label>Tagline</label>
            <input class="input" name="tagline" value="${escape(s.tagline)}">
          </div>
        </div>
      </div>

      <div class="adm-card admin-mt-4">
        <div class="adm-card-head">
          <h3>Integrations</h3>
        </div>
        <div class="adm-card-body">
          <div class="adm-form-row">
            <div class="adm-field">
              <label>Order webhook URL</label>
              <input class="input mono" name="webhookUrl" value="${escape(s.webhookUrl)}">
              <div class="hint">Sindo will POST every order to this endpoint.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="adm-card admin-mt-4" style="border-color:var(--c-warning); background:linear-gradient(135deg, #fffbeb, white);">
        <div class="adm-card-body" style="display:flex;gap:16px;align-items:flex-start;">
          <div style="font-size:24px;">⚠️</div>
          <div>
            <div style="font-weight:600;">Destructive action</div>
            <div class="muted" style="font-size:13px;">Reset all local data: orders, products edits, reviews, subscribers.</div>
            <button type="button" class="btn btn-ghost btn-sm mt-2" onclick="resetAll()" style="color:var(--c-error);">Reset all data…</button>
          </div>
        </div>
      </div>

      <div class="row" style="gap:8px;margin-top:24px;">
        <button type="submit" class="btn btn-primary">Save settings</button>
        <button type="button" class="btn btn-ghost" onclick="load(); render();">Cancel</button>
      </div>
    </form>
  `;

  document.getElementById('settings-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    save(fd);
    sindoToast('Settings saved');
  });
}

window.resetAll = function() {
  if (!confirm('Reset all local admin data? This will clear orders, reviews, and product edits stored in this browser. The catalog import will reload on refresh.')) return;
  ['sindo_admin_orders_v1', 'sindo_admin_products_v1', 'sindo_reviews_v1', 'sindo_subscribers_v1', 'sindo_settings_v1'].forEach(k => localStorage.removeItem(k));
  sindoToast('All data reset');
  setTimeout(() => location.reload(), 600);
};

render();
</script>
</body>
</html>
