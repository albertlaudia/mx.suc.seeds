# Sindo Wellness — nginx config (security-hardened)
# Static storefront served by nginx:1.27-alpine, behind Dokploy/Traefik.

# ─── Security headers (applied to every response) ────────────────────────────
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://cloudinary.images-iherb.com data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Server "" always;

# Hide nginx version
server_tokens off;

# ─── Rate limiting (defense against brute force / scraping) ──────────────────
# 30 requests per second per IP for the store; tighter for cart/checkout
limit_req_zone $binary_remote_addr zone=store:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=checkout:10m rate=5r/s;

# Block common exploit paths
location ~* (wp-admin|wp-login|\.env|\.git|\.sql|\.bak|phpmyadmin) {
    deny all;
    return 404;
}

# Block hidden files (.htaccess, .htpasswd, etc.)
location ~ /\. {
    deny all;
    return 404;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;
gzip_proxied any;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Limit body size for static-only site (defense)
    client_max_body_size 1m;

    # Hide sensitive file types
    location ~* \.(ini|log|sh|sql|conf)$ {
        deny all;
        return 404;
    }

    # Healthcheck endpoint for Dokploy
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Cache HTML no-cache so deploys show immediately
    location ~* \.html$ {
        limit_req zone=store burst=50 nodelay;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ =404;
    }

    # Cache static assets (JS, CSS) for 1 hour with cache-bust via ?v=
    location ~* \.(js|css)$ {
        limit_req zone=store burst=100 nodelay;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Cache images aggressively (iHerb CDN handles their cache, we just cache our own)
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Tighter rate limit on checkout
    location = /checkout.html {
        limit_req zone=checkout burst=10 nodelay;
        try_files $uri $uri/ =404;
    }

    # Default: serve file or 404
    location / {
        limit_req zone=store burst=50 nodelay;
        try_files $uri $uri/ /404.html;
    }

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;
}
